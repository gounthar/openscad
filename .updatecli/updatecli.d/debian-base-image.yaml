name: Update Debian base image in Dockerfile

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  debian-trixie:
    name: Get latest Debian Trixie slim image tag
    kind: dockerimage
    spec:
      image: debian
      tagfilter: 'trixie-\d{8}-slim'
      versionfilter:
        kind: regex
        pattern: 'trixie-(\d{8})-slim'

conditions:
  docker-image-exists:
    name: Verify Debian image exists on Docker Hub
    kind: dockerimage
    spec:
      image: debian
      tag: '{{ source "debian-trixie" }}'

targets:
  dockerfile:
    name: Update Dockerfile base image
    kind: dockerfile
    spec:
      file: docker/Dockerfile
      instruction:
        keyword: FROM
        matcher: debian
    sourceid: debian-trixie
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): update Debian base image to {{ source "debian-trixie" }}'
    spec:
      labels:
        - dependencies
        - docker
