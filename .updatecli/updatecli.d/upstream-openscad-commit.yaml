name: 'deps(dockerfile): bump upstream OpenSCAD commit'

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: "{{ requiredEnv .github.token }}"
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
  openscad-latest-commit:
    name: Get latest OpenSCAD commit from master branch
    kind: gitbranch
    spec:
      url: https://github.com/openscad/openscad.git
      branch: master
      key: hash
      versionfilter:
        kind: latest

targets:
  dockerfile-commit:
    name: 'deps(dockerfile): bump ARG "OPENSCAD_COMMIT"'
    scmid: default
    kind: dockerfile
    spec:
      file: docker/Dockerfile
      instruction:
        keyword: ARG
        matcher: OPENSCAD_COMMIT
    sourceid: openscad-latest-commit

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): update upstream OpenSCAD commit'
    spec:
      labels:
        - dependencies
        - upstream-sync
