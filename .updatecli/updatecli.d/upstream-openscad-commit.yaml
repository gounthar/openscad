name: Update upstream OpenSCAD commit in Dockerfile

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: '{{ requiredEnv "GITHUB_TOKEN" }}'
      branch: "{{ .github.branch }}"

sources:
  openscad-latest-commit:
    name: Get latest OpenSCAD commit from master branch
    kind: gitbranch
    spec:
      url: https://github.com/openscad/openscad.git
      branch: master
      key: hash
      versionfilter:
        kind: latest

targets:
  dockerfile-commit:
    name: Update OPENSCAD_COMMIT in Dockerfile
    kind: file
    spec:
      file: docker/Dockerfile
      matchpattern: 'ARG\s+OPENSCAD_COMMIT\s*=\s*[a-fA-F0-9]{40}'
      replacepattern: 'ARG OPENSCAD_COMMIT={{ source "openscad-latest-commit" }}'
    scmid: default

actions:
  default:
    kind: github/pullrequest
    scmid: default
    spec:
      title: 'chore(deps): update upstream OpenSCAD commit'
      labels:
        - dependencies
        - upstream-sync
      description: |
        ## Automated Upstream OpenSCAD Sync

        Updates the Docker build to use the latest commit from upstream OpenSCAD repository.

        **Upstream Repository:** https://github.com/openscad/openscad

        **Verification Checklist:**
        - [ ] Docker build completes for all architectures (amd64, arm64, riscv64)
        - [ ] OpenSCAD builds correctly inside container
        - [ ] All tests pass
        - [ ] Binary is functional

        ---
        🤖 Auto-generated by [UpdateCLI](https://www.updatecli.io/)
