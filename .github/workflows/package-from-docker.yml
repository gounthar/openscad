          dpkg-deb --contents ${PKG_DIR}.deb | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: debian-riscv64-docker
          path: "*.deb"

  summary:
    name: Package Summary
    runs-on: ubuntu-latest
    needs: [package-amd64, package-arm64, package-riscv64]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: packages

      - name: List packages
        run: |
          echo "## Built Packages from Docker" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Packages extracted from Docker image and repackaged as .deb:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          find packages -name "*.deb" -exec basename {} \; | sort | while read pkg; do
            size=$(find packages -name "$pkg" -exec du -h {} \; | cut -f1)
            echo "- **$pkg** ($size)" >> $GITHUB_STEP_SUMMARY
          done
