          fi

          INSTALLED_SIZE=$(du -sk ${PKG_DIR} | cut -f1)

          cat > ${PKG_DIR}/DEBIAN/control << EOF
          Package: openscad
          Version: ${PKG_VERSION}-${{ env.PACKAGE_REVISION }}
          Section: graphics
          Priority: optional
          Architecture: ${PKG_ARCH}
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Bruno Verachten <gounthar@gmail.com>
          Homepage: https://openscad.org/
          Description: script file based graphical CAD environment
           OpenSCAD is a software for creating solid 3D CAD objects. It focuses on CAD
           aspects rather than artistic ones.
           .
           OpenSCAD is not an interactive modeller. Instead it is something like a
           3D-compiler that reads in a script file that describes the object and renders
           the 3D model from this script. This gives the designer full control over the
           modelling process and enables him to easily change any step in the modelling
           process or make designs that are defined by configurable parameters.
           .
           This package was built from Docker image for arm64 architecture.
          EOF

          sed -i 's/^          //' ${PKG_DIR}/DEBIAN/control

      - name: Build Debian package
        run: |
          PKG_NAME="openscad"
          PKG_VERSION="${{ env.PACKAGE_VERSION }}"
          PKG_ARCH="arm64"
          PKG_DIR="${PKG_NAME}_${PKG_VERSION}-${{ env.PACKAGE_REVISION }}_${PKG_ARCH}"

          dpkg-deb --build ${PKG_DIR}
          dpkg-deb --info ${PKG_DIR}.deb
          dpkg-deb --contents ${PKG_DIR}.deb | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: debian-arm64-docker
          path: "*.deb"

