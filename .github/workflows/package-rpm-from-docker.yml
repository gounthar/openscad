name: Package RPM from Docker Image

on:
  workflow_run:
    workflows: ["Build and Push Docker Image (Multi-Platform)"]
    types:
      - completed
    branches:
      - multiplatform
  workflow_dispatch:

env:
  DOCKER_IMAGE: ghcr.io/gounthar/openscad

jobs:
  package-rpm:
    name: Package RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            target: x86_64
            qemu: false
          - arch: arm64
            platform: linux/arm64
            target: aarch64
            qemu: true
          - arch: riscv64
            platform: linux/riscv64
            target: riscv64
            qemu: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Determine version
        id: version
        run: |
          VERSION=$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Package version: ${VERSION}"

      - name: Install RPM build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpmlint

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker
        run: |
          docker --version
          docker info

      - name: Pull Docker image
        run: |
          docker pull --platform ${{ matrix.platform }} ${{ env.DOCKER_IMAGE }}:latest

      - name: Extract OpenSCAD binary, data, and documentation
        run: |
          CONTAINER_ID=$(docker create --platform ${{ matrix.platform }} ${{ env.DOCKER_IMAGE }}:latest)

          mkdir -p extract

          # Extract binary
          docker cp ${CONTAINER_ID}:/usr/local/bin/openscad extract/openscad

          # Extract data files
          docker cp ${CONTAINER_ID}:/usr/local/share extract/share 2>&1 || echo "Warning: Could not extract share directory"

          # Extract license and docs from common locations
          docker cp ${CONTAINER_ID}:/usr/local/share/doc/openscad/COPYING extract/COPYING 2>&1 || \
          docker cp ${CONTAINER_ID}:/usr/share/doc/openscad/COPYING extract/COPYING 2>&1 || \
          echo "COPYING not found in container"

          docker cp ${CONTAINER_ID}:/usr/local/share/doc/openscad/README.md extract/README.md 2>&1 || \
          docker cp ${CONTAINER_ID}:/usr/share/doc/openscad/README.md extract/README.md 2>&1 || \
          echo "README.md not found in container"

          docker rm ${CONTAINER_ID}

          # Validate binary extraction
          if [ ! -f extract/openscad ]; then
            echo "Error: Failed to extract openscad binary"
            exit 1
          fi

          chmod +x extract/openscad

          # Fallback to repo files if not found in container
          if [ ! -f extract/COPYING ]; then
            if [ -f COPYING ]; then
              cp COPYING extract/COPYING
              echo "Using COPYING from repository"
            else
              echo "Error: COPYING file not found in Docker image or repository"
              echo "The license file is required for RPM packaging and GPL compliance"
              exit 1
            fi
          fi
          if [ ! -f extract/README.md ]; then
            if [ -f README.md ]; then
              cp README.md extract/README.md
              echo "Using README.md from repository"
            else
              echo "Error: README.md file not found in Docker image or repository"
              echo "Documentation is required for proper RPM packaging"
              exit 1
            fi
          fi

          echo "Extracted files:"
          ls -la extract/

      - name: Set up RPM build tree
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # Copy binary and data to SOURCES
          cp extract/openscad ~/rpmbuild/SOURCES/
          cp extract/COPYING ~/rpmbuild/SOURCES/
          cp extract/README.md ~/rpmbuild/SOURCES/
          cp -r extract/share ~/rpmbuild/SOURCES/ 2>&1 || true

          # Copy spec file
          cp rpm/openscad.spec ~/rpmbuild/SPECS/

          # Update version in spec
          sed -i "s/^Version:.*/Version:        ${{ steps.version.outputs.version }}/" ~/rpmbuild/SPECS/openscad.spec

      - name: Build RPM package
        run: |
          cd ~/rpmbuild/SPECS
          rpmbuild -bb --target ${{ matrix.target }} openscad.spec

          echo "Built RPM package:"
          ls -lh ~/rpmbuild/RPMS/${{ matrix.target }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rpm-${{ matrix.arch }}-docker
          path: /home/runner/rpmbuild/RPMS/${{ matrix.target }}/*.rpm
          retention-days: 7
